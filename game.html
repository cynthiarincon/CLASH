<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/game.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <title>CLASH!</title>
</head>
<body>
<!--NAVIGATION BAR-->
 <nav>
    <img src="assets/images/CLASH!-logo.png" alt="CLASH! logo">
    <div class="dropdown-menu">☰</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="game.html">Play</a></li>
        <li><a href="faq.html">FAQ</a></li>
    </ul>
 </nav>

<!--- BACKGROUND MUSIC --->
    <audio id="music" controls autoplay loop>
        <source src="assets/sounds/track1.mp3" type="audio/mpeg">
    </audio>

<!-------------------------------------------------------------->
<!-----------------------MAIN CONTAINER------------------------->
<!-------------------------------------------------------------->
    <main>
<!--- TITLE/SLOGAN AREA --->
        <div class="slogan">
        <h1>SMASH! WRAP! SLICE!</h1>
        <h2>. . CLASH!</h2>
        </div>

<!--- ENTER A CHOICE OR CHOOSE RANDOMIZE --->
        <div class="enter-choice">
            <label for="choice">PLAYER MUST CHOOSE ONE:
                <br> SMASH, WRAP, OR SLICE</label>
            <input type="text" id="choice" placeholder="Enter a choice" name="choice" maxlength="5">
            <button class="class-btn">CLASH!</button>
            <p>or</p>
            <button class="randomize-btn">RANDOMIZE</button>
        </div>
<hr>  <!--LINE BREAK--> 

        <div class="choices">
            <img src="assets/images/rock.png" alt="rock">
            <img src="assets/images/paper.jpg" alt="paper">
            <img src="assets/images/scissor.png" alt="scissor">            
        </div>
        
<!----- RESET BUTTON ----->
        <button class="reset" type="reset">RESET</button>

<!--- RESULT DISPLAY --->
        <div class="result"></div>
    </main>
<!-------------------------------------------------------------->
<!----------------------MAIN CONTAINER END---------------------->
<!-------------------------------------------------------------->

<!----- FOOTER ----->
    <footer>...</footer>


    <script src="js/game.js"></script>
</body>
</html>
