<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/game.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <title>CLASH!</title>
</head>
<body>
    <audio id="music" controls autoplay loop>
        <source src="/assets/sounds/track1.mp3" type="audio/mpeg">
    </audio>

    <nav>...</nav>

    <main>
        <div class="slogan">
        <h1>SMASH! WRAP! SLICE!</h1>
        <h2>. . CLASH!</h2>
        </div>

<!-------ENTER A CHOICE OR CHOOSE RANDOMIZE---------->
        <div class="enter-choice">
            <label for="choice">PLAYER MUST CHOOSE ONE:
                <br> SMASH, WRAP, OR SLICE</label>
            <input type="text" id="choice" placeholder="Enter a choice" name="choice" maxlength="5">
            <button class="class-btn">CLASH!</button>
            <p>or</p>
            <button class="randomize-btn">RANDOMIZE</button>
        </div>

        <hr>

        <div class="choices">
            <img src="assets/images/rock.png" alt="rock">
            <img src="assets/images/paper.jpg" alt="paper">
            <img src="assets/images/scissor.png" alt="scissor">            
        </div>
        
        <button class="reset" type="reset">RESET</button>
    </main>

    <footer>...</footer>
    <script src="js/game.js"></script>
</body>
</html>
